<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="805" viewBox="0 0 1460 805">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker>
  <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker>
</defs>
<rect width="1460" height="805" fill="#FFFFFF"/>
<text x="40" y="48" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#101828">Search and edit with lost-update protection</text>
<text x="40" y="74" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475467">Optimistic concurrency with ETag / If-Match; every change is audited and published</text>
<rect x="25" y="110" width="170" height="50" rx="10" fill="#0B2A5B" stroke="#0B2A5B" stroke-width="0"/>
<text x="110" y="139.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pricing Analyst</text>
<line x1="110" y1="166" x2="110" y2="765" stroke="#C5CCD8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="295" y="110" width="170" height="50" rx="10" fill="#0F5BD8" stroke="#0F5BD8" stroke-width="0"/>
<text x="380" y="139.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile app</text>
<line x1="380" y1="166" x2="380" y2="765" stroke="#C5CCD8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="675" y="110" width="170" height="50" rx="10" fill="#1D6FE8" stroke="#1D6FE8" stroke-width="0"/>
<text x="760" y="139.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pricing API</text>
<line x1="760" y1="166" x2="760" y2="765" stroke="#C5CCD8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="995" y="110" width="170" height="50" rx="10" fill="#0A7D74" stroke="#0A7D74" stroke-width="0"/>
<text x="1080" y="139.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aurora PostgreSQL</text>
<line x1="1080" y1="166" x2="1080" y2="765" stroke="#C5CCD8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="1245" y="110" width="170" height="50" rx="10" fill="#1D6FE8" stroke="#1D6FE8" stroke-width="0"/>
<text x="1330" y="139.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Event bus</text>
<line x1="1330" y1="166" x2="1330" y2="765" stroke="#C5CCD8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="110" y1="205" x2="376" y2="205" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="245" y="197" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">1. Search 'coffee', country IN</text>
<line x1="380" y1="251" x2="756" y2="251" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="570" y="243" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">2. GET /prices?q=coffee&amp;countryCode=IN&amp;limit=25</text>
<line x1="760" y1="297" x2="1076" y2="297" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="920" y="289" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">3. scoped query, keyset page (no OFFSET)</text>
<line x1="760" y1="343" x2="384" y2="343" stroke="#475467" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="570" y="335" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">4. 200 {items, nextCursor}</text>
<line x1="110" y1="395" x2="376" y2="395" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="245" y="387" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">5. Open record, change price, give reason</text>
<line x1="380" y1="441" x2="756" y2="441" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="570" y="433" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">6. PATCH /prices/{id} · If-Match: &quot;3&quot;</text>
<line x1="760" y1="487" x2="1076" y2="487" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="920" y="479" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">7. UPDATE … WHERE version = 3; audit; outbox</text>
<rect x="280" y="507" width="1150" height="96" rx="8" fill="none" stroke="#9DB7E6" stroke-width="1.5"/>
<rect x="280" y="507" width="123" height="22" rx="6" fill="#F2F6FC" stroke="#9DB7E6"/>
<text x="289" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F5BD8">version still 3</text>
<line x1="760" y1="553" x2="384" y2="553" stroke="#475467" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="570" y="545" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">8. 200 · ETag &quot;4&quot;</text>
<line x1="1080" y1="599" x2="1326" y2="599" stroke="#475467" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="1205" y="591" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">9. PriceChanged</text>
<rect x="280" y="629" width="1150" height="132" rx="8" fill="none" stroke="#9DB7E6" stroke-width="1.5"/>
<rect x="280" y="629" width="186" height="22" rx="6" fill="#F2F6FC" stroke="#9DB7E6"/>
<text x="289" y="644" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F5BD8">someone changed it first</text>
<line x1="760" y1="675" x2="384" y2="675" stroke="#475467" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="570" y="667" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#101828" text-anchor="middle">10. 412 Precondition Failed + current record</text>
<rect x="260" y="703" width="240" height="44" rx="6" fill="#FFF8E6" stroke="#E9C46A"/>
<text x="380" y="721" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#101828" text-anchor="middle">Show who changed it and their value:</text>
<text x="380" y="737.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#101828" text-anchor="middle">&quot;Use latest&quot; or &quot;Keep my changes&quot;</text>
</svg>
